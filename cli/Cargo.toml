[workspace]

[package]
name = "hexcrow"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Hexcrow client: runs private milestone escrows on the Tari Ootle"

[[bin]]
name = "hexcrow"
path = "src/main.rs"

[dependencies]
ootle-rs = "0.29"
tari_ootle_transaction = { version = "0.47", features = ["serde"] }
tari_ootle_common_types = "0.47"
tari_template_lib_types = "0.35"
tari_crypto = "0.24"
tari_utilities = "0.10"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
# OS randomness for invoice salts and approval codes.
getrandom = "0.2"
# Plain JSON reads of the public indexer, the same ones the web demo makes, for `hexcrow verify`.
reqwest = { version = "0.13", features = ["json"] }
# Same versions ootle-rs 0.29 uses, to anchor validator-set trust on an earlier checkpoint.
tari_indexer_client = { version = "0.48", default-features = false, features = ["client"] }
tari_ootle_light_client = "0.1"
